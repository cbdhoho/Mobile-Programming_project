<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Timer</title>
    <link href="timer.png" rel="shortcut icon" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poor+Story&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="headerStyle.css">
    <link rel="stylesheet" href="todo-list-style.css">
</head>

<body>
    <header>
        <div id="topContainer">
            <div id="topParagraph">오늘의 명언</div>
            <div id="topSetting">
                <div id="nameChange">이름 변경</div>
                <div id="init">초기화</div>
            </div>
        </div>
        <div>
            <h1 id="headerTitle">김민선's Study Timer</h1>
        </div>
    </header>
    <hr>
    <nav>
        <ul>
            <li><a href="study-timer.html" class="nav-link">공부 타이머</a></li>
            <li><a href="todo-list.html" class="nav-link">할일 관리</a></li>
            <li><a href="study-calendar.html" class="nav-link">학습 캘린더</a></li>
            <li><a href="white-noise.html" class="nav-link">백색소음</a></li>
        </ul>
    </nav>
    <section class="todo-container">
        <h2><span id="selected-date-title"></span></h2>
        <div class="date-picker-container">            
            <input type="date" id="date-picker" style="cursor: pointer"/>
        </div>
        <ul id="todo-list"></ul>
        <div class="todo-input-container">
            <input type="text" id="todo-input" class="custom-checkbox" placeholder="새로운 할일을 입력하세요">
            <button id="add-todo">추가</button>
        </div>
    </section>
    <footer>

    </footer>
    <script src="todo-list-script.js"></script>
</body>

</html>
