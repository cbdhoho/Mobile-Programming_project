<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Timer</title>
    <link href="timer.png" rel="shortcut icon" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poor+Story&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="headerStyle.css">
    <link rel="stylesheet" href="todo-list.css">
</head>

<body>
    <header>
        <div id="topContainer">
            <div id="topParagraph">오늘의 명언</div>
            <div id="topSetting">
                <div id="nameChange">이름 변경</div>
                <div id="init">초기화</div>
            </div>
        </div>
        <div>
            <h1 id="headerTitle">김민선's Study Timer</h1>
        </div>
    </header>
    <hr>
    <nav>
        <ul>
            <li><a href="study-timer.html" class="nav-link">공부 타이머</a></li>
            <li><a href="todo-list.html" class="nav-link">할일 관리</a></li>
            <li><a href="study-calendar.html" class="nav-link">학습 캘린더</a></li>
            <li><a href="white-noise.html" class="nav-link">백색소음</a></li>
        </ul>
    </nav>
    <section>
        <div class="date-container">
            <div class="date">2024.12.02(Mon)</div>
            <div class="calendar-icon"><img src="calendar.png" alt="calendar" width="20" height="20"></div>
        </div>
        <div class="todo-container">
            <h2>오늘의 할일</h2>
            <hr>
            <ul id="todo-list">
                <li><input type="checkbox" id="todo1"><label for="todo1">영어 단어 50개 외우기</label></li>
                <li><input type="checkbox" id="todo2"><label for="todo2">수학 문제집 3장 풀기</label></li>
                <li><input type="checkbox" id="todo3"><label for="todo3">독서 30분하기</label></li>
            </ul>
            <div class="todo-input-container">
                <input type="text" id="todo-input" placeholder="새로운 할일을 입력하세요">
                <button id="add-todo">추가</button>
            </div>
        </div>
    </section>
    <footer>

    </footer>
</body>

</html>
