<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Timer</title>
    <link href="timer.png" rel="shortcut icon" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poor+Story&display=swap" rel="stylesheet">
    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@5.10.2/main.min.css' rel='stylesheet' />
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@5.10.2/main.min.js'></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="headerStyle.css">
    <link rel="stylesheet" href="study-calendar-style.css">
</head>

<body>
    <header>
        <div id="topContainer">
            <div id="topParagraph">오늘의 명언</div>
            <div id="topSetting">
                <div id="nameChange">이름 변경</div>
                <div id="init">초기화</div>
            </div>
        </div>
        <div>
            <h1 id="headerTitle">김민선's Study Timer</h1>
        </div>
    </header>
    <hr>
    <nav>
        <ul>
            <li><a href="study-timer.html" class="nav-link">공부 타이머</a></li>
            <li><a href="todo-list.html" class="nav-link">할일 관리</a></li>
            <li><a href="study-calendar.html" class="nav-link">학습 캘린더</a></li>
            <li><a href="white-noise.html" class="nav-link">백색소음</a></li>
        </ul>
    </nav>
    <section>
        <article class="calendar-container">
            <h2>12월 학습 캘린더</h2>
            <table id="calendar">
                <thead>
                    <tr>
                        <th>일</th><th>월</th><th>화</th><th>수</th><th>목</th><th>금</th><th>토</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td></td><td></td><td></td><td></td><td></td><td>1<br>2h</td><td>2<br>3h</td>
                    </tr>
                    <tr>
                        <td>3<br>1h</td><td>4<br>2h</td><td>5<br>3h</td><td>6<br>2h</td><td>7<br>4h</td><td>8<br>3h</td><td>9<br>5h</td>
                    </tr>
                    <!-- 나머지 주차 생략 -->
                </tbody>
            </table>
        </article>
        <article class="statistics-container">
            <h2>12월 학습 통계</h2>
            <div class="chart-container">
                <div class="chart-legend">
                    <div class="legend-item"><span class="color-box" style="background-color: #FF6384;"></span>국어: 25%</div>
                    <div class="legend-item"><span class="color-box" style="background-color: #36A2EB;"></span>영어: 30%</div>
                    <div class="legend-item"><span class="color-box" style="background-color: #FFCE56;"></span>수학: 35%</div>
                    <div class="legend-item"><span class="color-box" style="background-color: #4BC0C0;"></span>과학: 10%</div>
                </div>
                <div class="pie-chart">
                    <!-- 원 도표를 CSS로 표현 -->
                </div>
            </div>
        </article>
    </section>
    <footer>

    </footer>
</body>

</html>
