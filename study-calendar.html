<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Timer</title>
    <link href="timer.png" rel="shortcut icon" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poor+Story&display=swap" rel="stylesheet">
    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@5.10.2/main.min.css' rel='stylesheet' />
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@5.10.2/main.min.js'></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="headerStyle.css">
    <link rel="stylesheet" href="study-calendar-style.css">
</head>

<body>
    <header>
        <div id="topContainer">
            <div id="topParagraph">오늘의 명언</div>
            <div id="topSetting">
                <div id="nameChange">이름 변경</div>
                <div id="initButton">초기화</div>
            </div>
        </div>
        <div>
            <h1 id="headerTitle">김민선's Study Timer</h1>
        </div>
    </header>
    <hr>
    <nav>
        <ul>
            <li><a href="study-timer.html" class="nav-link">공부 타이머</a></li>
            <li><a href="todo-list.html" class="nav-link">할일 관리</a></li>
            <li><a href="study-calendar.html" class="nav-link">학습 캘린더</a></li>
            <li><a href="study-song.html" class="nav-link">공부 노래</a></li>
        </ul>
    </nav>
    <section>
        <article class="calendar-container">
            <h2 id="month-year"></h2>
            <button id="prev-month">◀</button>
            <button id="next-month">▶</button>

            <table id="calendar">
                <thead>
                    <tr>
                        <th>일</th><th>월</th><th>화</th><th>수</th><th>목</th><th>금</th><th>토</th>
                    </tr>
                </thead>
                <tbody id="calendar-body"></tbody>
            </table>

            <!-- 월별 학습 통계 -->
            <article class="chart-container">
                <canvas id="myChart"></canvas> <!-- 차트를 위한 캔버스 -->
            </article>

        </article>
    </section>

    <footer></footer>
    <script src='https://cdn.jsdelivr.net/npm/chart.js'></script>
    <script src='study-calendar-script.js'></script>
    <script src="quote.js"></script>
    <script src="header-script.js"></script>
</body>

</html>
