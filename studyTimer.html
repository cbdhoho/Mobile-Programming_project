<head>
    <meta charset="UTF-8">

    <title>Study Timer</title>
    <link href="timer.png" rel="shortcut icon" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poor+Story&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: "Poor Story", Arial, Helvetica, sans-serif;
            font-weight: 600;
            font-style: normal;
        }
        #topContainer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #topSetting {
            display: flex;
            gap: 10px; /* 버튼 사이의 간격 */
        }
        #nameChange, #init {
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        #nameChange:hover, #init:hover {
            background-color: #e9ecef;
        }
        #headerTitle {
            text-align: center;
        }
        nav {
            background-color: #f8f9fa;
            padding: 10px 0;
        }
        
        nav ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
            display: flex;
            justify-content: space-around;
        }
        
        nav ul li a {
            text-decoration: none;
            color: #333;
            padding: 5px 10px;
        }
        
        nav ul li a:hover {
            background-color: #e9ecef;
            border-radius: 5px;
        }
    </style>
</head>

<body>

        <div id="topContainer">
